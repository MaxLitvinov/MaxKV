name: MaxKV Full Test & Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  full-test-and-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./maxkv

    steps:
      - name: Завантаження коду
        uses: actions/checkout@v4

      - name: Встановлення інструментів (lcov та redis-tools)
        run: sudo apt-get update && sudo apt-get install -y lcov redis-tools

      - name: 1. Збірка з підтримкою Code Coverage та прогін тестів
        run: |
          g++ -std=c++20 -O0 -g --coverage -Iinclude src/*.cpp tests/test_main.cpp -lpthread -o build_cov_tests
          ./build_cov_tests

      - name: 2. Генерація звіту покриття (lcov)
        run: |
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
          lcov --list coverage.info

      - name: 3. Відправка звіту в Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./maxkv/coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 4. Перевірка пам'яті та UB (AddressSanitizer + UBSan)
        run: |
          make clean
          make SAN=address -j$(nproc)
          ./build/maxkv_tests

      - name: 5. Перевірка багатопотоковості (ThreadSanitizer)
        run: |
          make clean
          make SAN=thread -j$(nproc)
          ./build/maxkv_tests

      - name: 6. Стрес-тест та перевірка відновлення AOF
        run: |
          make clean
          make -j$(nproc)
          ./build/maxkv --port 6380 --threads 4 --aof ci_crash.aof &
          SERVER_PID=$!
          sleep 1
          redis-benchmark -p 6380 -c 50 -n 100000 -P 16 -t set,get,incr,mget
          kill -9 $SERVER_PID
          echo "CORRUPTED_TAIL" >> ci_crash.aof
          ./build/maxkv --port 6380 --threads 4 --aof ci_crash.aof &
          SERVER_PID=$!
          sleep 1
          kill $SERVER_PID
